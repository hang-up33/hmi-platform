# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 設定。レビュー出力（要約・walkthrough・指摘コメント）を日本語にする。
# 参考: https://docs.coderabbit.ai/getting-started/configure-coderabbit
language: "ja-JP"

# レビューの語調も日本語前提で指示する（language だけでも日本語化されるが、
# 言い回しを安定させるため明示する）。
tone_instructions: "日本語で、簡潔かつ丁寧にレビューしてください。指摘は重要度（重大/軽微/nitpick）を添えてください。"
