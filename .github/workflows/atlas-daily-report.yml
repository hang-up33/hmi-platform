name: Atlas daily report

# 平日の毎朝 8:47（日本時間）に、直近24時間の動きを Slack の #ai自律化 へ投稿する。
# AI は使わない。GitHub のデータを集めて定型の文にするだけ。
# 仕組みと設定は Docs/ai-automation.md を参照。
on:
  schedule:
    # cron は UTC。日本時間の月〜金 8:47 は、UTC の日〜木 23:47。
    - cron: "47 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: atlas-daily-report
  cancel-in-progress: false

jobs:
  report:
    name: Slack へ進捗を投稿する
    if: github.repository == 'hang-up33/hmi-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"

          merged_json="$(gh pr list --state merged --search "merged:>=${since}" \
            --json number,title --limit 50)"
          merged_count="$(jq 'length' <<<"$merged_json")"
          if [ "$merged_count" -eq 0 ]; then
            merged_line="動きなし"
          else
            first="$(jq -r '.[0] | "#\(.number) \(.title)"' <<<"$merged_json")"
            merged_line="マージ ${merged_count} 件（${first} ほか）"
            [ "$merged_count" -eq 1 ] && merged_line="マージ 1 件（${first}）"
          fi

          failed_json="$(gh run list --branch main --status failure \
            --created ">=${since}" --json workflowName,url --limit 20)"
          failed_count="$(jq 'length' <<<"$failed_json")"
          if [ "$failed_count" -eq 0 ]; then
            ci_line="main の失敗なし"
          else
            ci_line="main で ${failed_count} 件失敗（$(jq -r '.[0].url' <<<"$failed_json")）"
          fi

          open_count="$(gh pr list --state open --json number --limit 100 | jq 'length')"

          # 次のタスクは、進捗の正本の「現在のフェーズ」にある最初の進捗ステータス行を使う。
          next_line="$(grep -m1 '進捗ステータス' Docs/phase-status.md | sed -e 's/^- \*\*進捗ステータス\*\*: *//' \
            | python3 -c 'import sys; print(sys.stdin.read().strip()[:70])')"
          [ -n "$next_line" ] || next_line="未記録（Docs/phase-status.md を参照）"

          {
            echo "*Atlas 進捗（$(TZ=Asia/Tokyo date +%m/%d)）*"
            echo "昨日: ${merged_line}"
            echo "CI: ${ci_line}"
            echo "未決: 開いている PR は ${open_count} 件"
            echo "次: ${next_line}"
          } > "${RUNNER_TEMP}/report.txt"
          cat "${RUNNER_TEMP}/report.txt"

      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN}" ] || [ -z "${SLACK_CHANNEL_ID}" ]; then
            echo "::error::Secret SLACK_BOT_TOKEN と Variable SLACK_CHANNEL_ID を設定してください（Docs/ai-automation.md）"
            exit 1
          fi
          payload="$(jq -n --arg c "${SLACK_CHANNEL_ID}" --rawfile t "${RUNNER_TEMP}/report.txt" \
            '{channel: $c, text: $t}')"
          res="$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "${payload}")"
          echo "${res}" | jq '{ok, error}'
          [ "$(jq -r '.ok' <<<"${res}")" = "true" ]
