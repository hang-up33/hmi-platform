name: CI

on:
  # 【CI コスト削減（2026-06-10）】GitHub Actions の課金を抑えるため、PR / push の
  # 自動トリガを一旦停止し、手動実行（workflow_dispatch）でのみ CI を回す運用に切替。
  # 元に戻すときは下記 pull_request / push のコメントアウトを解除する。
  #
  # pull_request:
  #   branches: [main]
  #   # 既定の types は opened/synchronize/reopened のみで、ラベル付与では workflow が
  #   # 起動しない。desktop ジョブを PR の `ci-desktop` ラベルで有効化する設計のため、
  #   # labeled を明示的に拾う（Codex PR #72 P2 指摘）。
  #   types: [opened, synchronize, reopened, labeled]
  # push:
  #   branches: [main]
  # 手動実行のみ。Actions タブ → CI → Run workflow で任意ブランチを検証できる。
  workflow_dispatch:

# 同じブランチで連続 push されたとき、古い CI をキャンセルして最新だけ走らせる。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux ジョブ：PR / push の毎回走る「主ゲート」。GitHub Actions の課金倍率が
  # Linux=1x（mac=10x / win=2x）と最も安く、private リポジトリの無料枠を温存できる。
  # このセッション（Ubuntu 24.04）で Qt 6.10.0 + offscreen により unit 8 + e2e 5 =
  # 13/13 緑を実証済み。日常の PR 検証はこのジョブで完結させる。
  linux:
    name: Linux / Qt 6.10
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt6（offscreen / QtQuick）のビルド・実行に必要な OS ライブラリと、日本語ラベル用
      # フォント、Ninja を導入する。一覧は scripts/web/setup.sh と揃えている
      # （ubuntu-latest = 24.04 を前提。libglib2.0-0t64 は 24.04 のパッケージ名）。
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libegl-mesa0 libxkbcommon0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libglib2.0-0t64 libx11-6 libxcb1 \
            libgl-dev libglx-dev libopengl-dev libegl-dev mesa-common-dev \
            ninja-build fonts-dejavu-core fonts-noto-cjk

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ""
          cache: true

      - name: Show toolchain
        run: |
          cmake --version
          g++ --version
          ninja --version
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      # ctest は QML テストで -platform offscreen を明示済み（add_test COMMAND 側）。
      # E2E テスト（label "e2e"）も harness.py 側で QT_QPA_PLATFORM=offscreen を
      # default 設定しているため GUI ディスプレイの無い CI ランナーでそのまま動く。
      # Linux では HMI_ENABLE_E2E が既定 ON なので unit 8 + e2e 5 = 13/13 が走る。
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: E2E tests (label only, for visibility)
        run: ctest --test-dir build -L e2e --output-on-failure -C Release

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-linux
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore

  # macOS / Windows ジョブ：課金倍率が高い（mac=10x / win=2x）ため **既定では PR で走らせない**。
  # 走るのは (1) main への push、(2) 手動 workflow_dispatch、(3) PR に `ci-desktop` ラベルを
  # 付けたとき の 3 ケースのみ。これで無料枠の消費を抑えつつ、必要な時だけ実機 2 OS の
  # ビルド・テストを確認できる（ローカル開発は元々 macOS / Windows 母艦で行う）。
  desktop:
    name: ${{ matrix.name }}
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'ci-desktop')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS / Qt 6.10
            os: macos-latest
            qt_host: mac
            qt_arch: clang_64
            build_dir: build
          - name: Windows / Qt 6.10 MinGW
            os: windows-latest
            qt_host: windows
            qt_arch: win64_mingw
            build_dir: build-mingw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Task 21: E2E テスト（tests/e2e/test_*.py）が Python ランナーで走る。
      # GitHub Actions の macos-latest / windows-latest には Python3 が同梱されているが、
      # 将来のランナー更新でバージョンが揺れるのを避けるため明示する。Windows MinGW では
      # HMI_ENABLE_E2E=OFF で E2E テスト自体が登録されないが、Python セットアップ自体は
      # 副作用がなく無条件で走らせて差分を減らす。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ローカル開発環境（macOS Homebrew Qt 6.11.1 / Windows Qt 6.11.0 MinGW）よりマイナーが
      # 1 下の 6.10.0 を CI では使う。Qt 6.11.0 は aqtinstall mirror（download.qt.io）の
      # Updates.xml にメタデータが見つからず failed to locate XML data で落ちた実績がある。
      # Qt 6.10.0 は aqtinstall で安定取得できるため CI 用の基準バージョンに据える。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ""
          # Windows MinGW kit を選ぶと aqt が tools_mingw1310 / tools_ninja も同梱しないため、
          # 別途 tools を指定する。macOS では tools は空のままで OK。
          tools: ${{ matrix.qt_host == 'windows' && 'tools_mingw1310 tools_ninja' || '' }}
          cache: true

      # Windows: jurplel/install-qt-action は tools を <Qt_root>/../../Tools/ 配下に入れるが
      # PATH には自動で追加してくれない。ローカルの setup-env.ps1 と同じく PATH 先頭に挿す。
      # QT_ROOT_DIR は .../Qt/<version>/<arch> を指すので、Tools/ には 2 階層上がる。
      - name: Add MinGW + Ninja to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtRoot = $env:QT_ROOT_DIR
          $toolsRoot = Resolve-Path (Join-Path $qtRoot '..\..\Tools')
          $mingwBin = Join-Path $toolsRoot 'mingw1310_64\bin'
          $ninjaBin = Join-Path $toolsRoot 'Ninja'
          Write-Host "Tools root: $toolsRoot"
          Write-Host "MinGW bin:  $mingwBin"
          Write-Host "Ninja bin:  $ninjaBin"
          if (-not (Test-Path $mingwBin)) { throw "MinGW not found at $mingwBin" }
          if (-not (Test-Path $ninjaBin)) { throw "Ninja not found at $ninjaBin" }
          # GITHUB_PATH に追記すると次のステップから PATH 先頭に乗る
          Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
          Add-Content -Path $env:GITHUB_PATH -Value $ninjaBin
          # 後続ステップから CMAKE_CXX_COMPILER 用に MinGW パスを参照できるようにする
          "MINGW_CXX=$mingwBin\g++.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Show toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --version
          clang++ --version
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"

      - name: Show toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          g++ --version
          ninja --version
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          Write-Host "MINGW_CXX=$env:MINGW_CXX"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B ${{ matrix.build_dir }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B ${{ matrix.build_dir }} -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DCMAKE_CXX_COMPILER=$env:MINGW_CXX"

      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --config Release --parallel

      # macOS では E2E が再実行される（e2e_smoke / e2e_place_and_drag /
      # e2e_save_load_roundtrip / e2e_simulator_display / e2e_style_roundtrip）。
      # Windows MinGW では HMI_ENABLE_E2E=OFF のため add_test が呼ばれず E2E は自動スキップ。
      - name: Test
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure -C Release

      - name: E2E tests (label only, for visibility)
        run: ctest --test-dir ${{ matrix.build_dir }} -L e2e --output-on-failure -C Release

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.os }}
          path: |
            ${{ matrix.build_dir }}/Testing/Temporary/LastTest.log
            ${{ matrix.build_dir }}/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
