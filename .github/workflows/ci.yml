name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同じブランチで連続 push されたとき、古い CI をキャンセルして最新だけ走らせる。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS / Qt 6.11
            os: macos-latest
            qt_host: mac
            qt_arch: clang_64
            build_dir: build
            cmake_extra: ""
            generator: ""
          - name: Windows / Qt 6.11 MinGW
            os: windows-latest
            qt_host: windows
            qt_arch: win64_mingw
            build_dir: build-mingw
            cmake_extra: ""
            generator: "Ninja"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Task 21: E2E テスト（tests/e2e/test_*.py）が Python ランナーで走る。
      # GitHub Actions の macos-latest / windows-latest には Python3 が同梱されているが、
      # 将来のランナー更新でバージョンが揺れるのを避けるため明示する。Windows MinGW では
      # HMI_ENABLE_E2E=OFF で E2E テスト自体が登録されないが、Python セットアップ自体は
      # 副作用がなく無条件で走らせて差分を減らす。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ローカル開発環境（macOS Homebrew Qt 6.11.1 / Windows Qt 6.11.0 MinGW）よりマイナーが
      # 1 下の 6.10.0 を CI では使う。Qt 6.11.0 は本 PR 初回ランで aqtinstall mirror
      # （download.qt.io）の Updates.xml にメタデータが見つからず failed to locate XML data
      # で落ちた。Qt 6.10.0 は aqtinstall で安定取得できるため CI 用の基準バージョンに据える。
      # API 互換性は Qt 6.x の minor 範囲で保たれており、本プロジェクトのテスト対象（Schema 単体
      # ＋ Qt Quick Test ＋ E2E）は Qt 6.8+ の機能しか使っていないため、6.10 でビルド・テスト緑なら
      # 6.11 ローカルでも同等を期待できる。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ""
          # Windows MinGW kit を選ぶと aqt が tools_mingw1310 / tools_ninja も同梱しないため、
          # 別途 tools を指定する。macOS では tools は空のままで OK。
          tools: ${{ matrix.qt_host == 'windows' && 'tools_mingw1310 tools_ninja' || '' }}
          cache: true

      # Windows: jurplel/install-qt-action は tools を <Qt_root>/../../Tools/ 配下に入れるが
      # PATH には自動で追加してくれない。ローカルの setup-env.ps1 と同じく PATH 先頭に挿す。
      # QT_ROOT_DIR は .../Qt/<version>/<arch> を指すので、Tools/ には 2 階層上がる。
      - name: Add MinGW + Ninja to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtRoot = $env:QT_ROOT_DIR
          $toolsRoot = Resolve-Path (Join-Path $qtRoot '..\..\Tools')
          $mingwBin = Join-Path $toolsRoot 'mingw1310_64\bin'
          $ninjaBin = Join-Path $toolsRoot 'Ninja'
          Write-Host "Tools root: $toolsRoot"
          Write-Host "MinGW bin:  $mingwBin"
          Write-Host "Ninja bin:  $ninjaBin"
          if (-not (Test-Path $mingwBin)) { throw "MinGW not found at $mingwBin" }
          if (-not (Test-Path $ninjaBin)) { throw "Ninja not found at $ninjaBin" }
          # GITHUB_PATH に追記すると次のステップから PATH 先頭に乗る
          Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
          Add-Content -Path $env:GITHUB_PATH -Value $ninjaBin
          # 後続ステップから CMAKE_CXX_COMPILER 用に MinGW パスを参照できるようにする
          "MINGW_CXX=$mingwBin\g++.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Show toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --version
          clang++ --version
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"

      - name: Show toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          g++ --version
          ninja --version
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          Write-Host "MINGW_CXX=$env:MINGW_CXX"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B ${{ matrix.build_dir }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B ${{ matrix.build_dir }} -G Ninja `
            "-DCMAKE_BUILD_TYPE=Release" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DCMAKE_CXX_COMPILER=$env:MINGW_CXX"

      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --config Release --parallel

      # ctest は QML テストで -platform offscreen を明示済み（add_test COMMAND 側）。
      # E2E テスト（label "e2e"）も harness.py 側で QT_QPA_PLATFORM=offscreen を
      # default 設定しているため GUI ディスプレイの無い CI ランナーでそのまま動く。
      # Windows MinGW では tests/e2e/CMakeLists.txt 側で HMI_ENABLE_E2E=OFF を検出して
      # add_test が呼ばれないため、E2E は自動スキップされる（Spix × AnyRPC の MinGW
      # 衝突を回避するための既存設計、CLAUDE.md「Spix（E2E）統合の罠」節）。
      - name: Test
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure -C Release

      # Task 21: E2E テストが実際に走ったことを CI 出力で見やすくする。
      # macOS では 4 件（e2e_smoke / e2e_place_and_drag / e2e_save_load_roundtrip
      # / e2e_simulator_display）が再実行される。Windows では 0 件（既知）でも
      # ctest -L は no matching tests を warning 扱いで exit 0 を返すため fail しない。
      - name: E2E tests (label only, for visibility)
        run: ctest --test-dir ${{ matrix.build_dir }} -L e2e --output-on-failure -C Release

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.os }}
          path: |
            ${{ matrix.build_dir }}/Testing/Temporary/LastTest.log
            ${{ matrix.build_dir }}/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
